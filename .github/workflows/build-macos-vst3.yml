name: Build Vinyl Pilot Universal VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-universal:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Configure JUCE plug-in
        run: >-
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Compile VST3
        run: cmake --build build --config Release --target VinylPilot_VST3 --parallel 3

      - name: Verify both Mac architectures
        shell: bash
        run: |
          set -euo pipefail
          binary="build/VinylPilot_artefacts/Release/VST3/Vinyl Pilot.vst3/Contents/MacOS/Vinyl Pilot"
          architectures="$(lipo -archs "$binary")"
          echo "Built architectures: $architectures"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]

      - name: Package .vst3 bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/VinylPilot_artefacts/Release/VST3/Vinyl Pilot.vst3"
          test -d "$bundle"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "VinylPilot_Universal_VST3.zip"

      - name: Upload ready-to-install plug-in
        uses: actions/upload-artifact@v4
        with:
          name: VinylPilot_Universal_VST3
          path: VinylPilot_Universal_VST3.zip
          if-no-files-found: error
